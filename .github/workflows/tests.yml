name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', dependencies: baseline}
          - {os: ubuntu-latest, python: '3.12', dependencies: baseline}
          - {os: windows-latest, python: '3.10', dependencies: baseline}
          - {os: windows-latest, python: '3.12', dependencies: baseline}
          - {os: macos-latest, python: '3.12', dependencies: baseline}
          - {os: ubuntu-latest, python: '3.14', dependencies: current}
          - {os: windows-latest, python: '3.14', dependencies: current}
          - {os: macos-latest, python: '3.14', dependencies: current}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.dependencies == 'baseline'
        run: python -m pip install -e ".[test]" "beets==2.14.1" "mediafile==0.17.0" "mutagen==1.47.0"
      - if: matrix.dependencies == 'current'
        run: python -m pip install --upgrade -e ".[test]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m build
      - run: python tools/check_wheel.py dist
