[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beets-allmbids"
version = "0.3.0"
description = "MusicBrainz contributor MBID enrichment through Beets' MediaFile layer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["beets>=2.14.1,<3", "mediafile>=0.17.0", "mutagen>=1.46"]

[project.optional-dependencies]
test = ["pytest>=8", "build", "soundfile>=0.12", "imageio-ffmpeg>=0.6"]

[tool.setuptools.packages.find]
include = ["beetsplug.allmbids*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
